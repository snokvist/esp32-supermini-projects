[env:esp32c3_supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  ; >=7.0.0 required: 6.6.0's findChip() probes WiFi/GNSS firmware versions in
  ; getVersionInfo(), which the LR1121 (no scanner) rejects -> begin_err=-2 on a
  ; fully working chip. 7.0.0+ guards those reads for the LR1121. Pinned to the
  ; current latest (7.6.0); LR1120::begin() + setIrqAction() are unchanged here.
  jgromes/RadioLib@7.6.0
  mikalhart/TinyGPSPlus@^1.0.3
  ; Meshtastic-compatible BLE GATT server (Phase G). Same NimBLE the repo's
  ; waybeam-connect already builds with on this exact C3 toolchain.
  h2zero/NimBLE-Arduino@^1.4.0

; Phase 0 bring-up firmware for the RadioMaster XR2 Nano (ESP32-C3 + LR1121).
; The board profile reuses the repo's esp32-c3 config; the XR2 IS an ESP32-C3.
; Board-specific pins / radio config live in src/board_config.h, now verified
; against the ExpressLRS XR2 hardware target (RX/"Generic C3 LR1121.json" + the
; "xr2" overlay in targets.json).

; XR2 bench bring-up env. The XR2 is reached via an FTDI on the CRSF UART
; (GPIO20/21 = C3 UART0), not the C3's native USB, so:
;   - log over UART0 instead of USB-CDC (ARDUINO_USB_CDC_ON_BOOT=0 maps Serial
;     -> UART0), so the FTDI sees the CSV / boot banner;
;   - flash over the same FTDI with the board held in download/boot mode
;     (esptool --before no_reset, since FTDI has no DTR/RTS -> EN/IO9 autoreset).
; The default esp32c3_supermini env keeps USB-CDC for native-USB (/dev/ttyACM*).
[env:esp32c3_xr2]
extends = env:esp32c3_supermini
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0

; Same as esp32c3_xr2 but injects a synthetic LoRa peer (no RF) so the BLE
; gateway's node-DB -> NodeInfo -> Meshtastic path can be validated on a single
; XR2 (a 2nd node shows in `meshtastic --info`). Test/bring-up only.
[env:esp32c3_xr2_testpeer]
extends = env:esp32c3_xr2
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DWAYMESH_TEST_PEER=1
