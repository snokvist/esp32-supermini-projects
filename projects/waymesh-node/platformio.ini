; NimBLE host-task stack: the default 4096 B overflows on the Meshtastic
; want_config handshake (onWrite ~2.1 KB frame + enqueueFromRadio tmp[384] +
; pb_encode -> ~4.6 KB peak) and corrupts adjacent FreeRTOS memory, which trips
; an `xQueueSemaphoreTake queue.c uxItemSize==0` assert + reboot. 8192 clears it
; with margin. Each firmware env references this (build_flags isn't inherited
; through `extends`, so it must be pulled in explicitly).
[common]
build_flags = -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=8192

[env:esp32c3_supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
  ${common.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  ; >=7.0.0 required: 6.6.0's findChip() probes WiFi/GNSS firmware versions in
  ; getVersionInfo(), which the LR1121 (no scanner) rejects -> begin_err=-2 on a
  ; fully working chip. 7.0.0+ guards those reads for the LR1121. Pinned to the
  ; current latest (7.6.0); LR1120::begin() + setIrqAction() are unchanged here.
  jgromes/RadioLib@7.6.0
  mikalhart/TinyGPSPlus@^1.0.3
  ; Meshtastic-compatible BLE GATT server (Phase G). Same NimBLE the repo's
  ; waybeam-connect already builds with on this exact C3 toolchain.
  h2zero/NimBLE-Arduino@^1.4.0

; Phase 0 bring-up firmware for the RadioMaster XR2 Nano (ESP32-C3 + LR1121).
; The board profile reuses the repo's esp32-c3 config; the XR2 IS an ESP32-C3.
; Board-specific pins / radio config live in src/board_config.h, now verified
; against the ExpressLRS XR2 hardware target (RX/"Generic C3 LR1121.json" + the
; "xr2" overlay in targets.json).

; XR2 bench bring-up env. The XR2 is reached via an FTDI on the CRSF UART
; (GPIO20/21 = C3 UART0), not the C3's native USB, so:
;   - log over UART0 instead of USB-CDC (ARDUINO_USB_CDC_ON_BOOT=0 maps Serial
;     -> UART0), so the FTDI sees the CSV / boot banner;
;   - flash over the same FTDI with the board held in download/boot mode
;     (esptool --before no_reset, since FTDI has no DTR/RTS -> EN/IO9 autoreset).
; The default esp32c3_supermini env keeps USB-CDC for native-USB (/dev/ttyACM*).
[env:esp32c3_xr2]
extends = env:esp32c3_supermini
build_flags =
  ${common.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0

; Same as esp32c3_xr2 but injects a synthetic LoRa peer (no RF) so the BLE
; gateway's node-DB -> NodeInfo -> Meshtastic path can be validated on a single
; XR2 (a 2nd node shows in `meshtastic --info`). Test/bring-up only.
[env:esp32c3_xr2_testpeer]
extends = env:esp32c3_xr2
build_flags =
  ${common.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DWAYMESH_TEST_PEER=1

; Host unit tests for the portable crypto core (lib/waymesh_crypto): the
; Meshtastic-compatible channel hash + PSK expansion (vs upstream-generated
; vectors) and AES-CCM (vs RFC 3610 / FIPS-197). No radio, no Arduino — runs on
; the build host: `pio test -e native`. Standalone (does not extend the C3 env)
; so none of the device lib_deps (RadioLib / NimBLE / TinyGPS) are pulled in.
[env:native]
platform = native
test_framework = unity
build_flags =
  -std=c11
  -Wall
  -Wextra

; Same as esp32c3_xr2 but counts our own beacons heard back on-air (a relay
; rebroadcast them) and logs a `relay_witness` event. This makes the relay
; round-trip measurable on a 2-node bench (XR2 + one waymesh-8285 relay) without
; a 3rd radio — see waymesh-8285 PoC relay. Debug/bring-up only; production
; esp32c3_xr2 stays clean. Drop the flag (or this env) to remove it entirely.
[env:esp32c3_xr2_relaytest]
extends = env:esp32c3_xr2
build_flags =
  ${common.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DWAYMESH_RELAY_WITNESS=1
