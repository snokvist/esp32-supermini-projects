[env:esp32c3_supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  jgromes/RadioLib@^6.6.0
  mikalhart/TinyGPSPlus@^1.0.3

; Phase 0 bring-up firmware for the RadioMaster XR2 Nano (ESP32-C3 + LR1121).
; The board profile reuses the repo's esp32-c3 config; the XR2 IS an ESP32-C3.
; Board-specific pins / radio config live in src/board_config.h and MUST be
; verified against the ExpressLRS XR2 hardware target before flashing.
