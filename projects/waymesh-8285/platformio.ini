; =============================================================================
; Waymesh Tier 2/3 firmware — ESP8285 + Semtech SX1280 (2.4 GHz LoRa)
;
; PoC #0 (THE GATE for the heterogeneous mesh): prove that the SX1280 on these
; ELRS-class 8285 boards interoperates on-air with the LR1121 on the Tier-1 XR2
; (projects/waymesh-node). Same beacon bytes, same radio params. If it works, the
; 8285 node shows up as a peer in the Meshtastic app via the XR2 BLE gateway.
;
; See ../../docs/hybrid-mesh/09-poc-roadmap.md (Phase H) and 02-hardware-and-rf-
; platform.md (the LR1121<->SX1280 interop crux).
; =============================================================================

; Common ESP8285 + SX1280 base. RadioLib pinned to 7.6.0 to match waymesh-node.
[env:esp8285_sx1280]
platform = espressif8266@4.2.1
board = esp8285
framework = arduino
board_build.f_cpu = 160000000L
monitor_speed = 115200
lib_deps =
  jgromes/RadioLib@7.6.0
  mikalhart/TinyGPSPlus@^1.0.3  ; vendor-neutral NMEA parser; only used under -DWAYMESH_GPS
; Share the canonical crypto+config libs from waymesh-node (single source of
; truth — no copy/drift). Chain LDF compiles ONLY #included libs, so the silent
; relay builds pull in nothing extra; only -DWAYMESH_WIFI_CONFIG builds compile
; waymesh_config + waymesh_crypto (nanopb / waymesh_beacon stay out until the
; Phase-B v2/auth port). See ../../docs/hybrid-mesh/13-auth-and-groups.md §8.4.
lib_extra_dirs = ../waymesh-node/lib
; chain+ evaluates #if guards, so waymesh_config/crypto are compiled ONLY for the
; -DWAYMESH_WIFI_CONFIG (and later v2/auth) builds — the silent relay firmware
; (bayck_7pwm / betafpv_nano) stays byte-for-byte the verified PoC build.
lib_ldf_mode = chain+

; BayckRC 7PWM (Tier 2) — ELRS "Generic 2400 PWMP7" hardware class. PRODUCTION
; build: the full v2/auth relay + GPS originator with the WiFi provisioning portal.
; Flash over the UART pads (GPIO1 TX / GPIO3 RX) with esptool at 460800. These
; bare RX boards usually have no DTR/RTS auto-reset, so hold GPIO0 low + power-
; cycle into download mode (same pattern as the XR2's BOOT hold).
[env:bayck_7pwm]
extends = env:esp8285_sx1280
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
upload_speed = 460800
build_flags =
  -DWAYMESH_TIER=2
  -DWAYMESH_BOARD_BAYCK_7PWM=1
  ; Managed-flood relay: seen-set dedup + SNR-delay + overhear suppression,
  ; verbatim re-flood, no hop-limit (board_config.h, docs/hybrid-mesh/05). The
  ; relay primitive is silicon-identical on the Tier-3 Nano; this env exercises
  ; it on Tier-2 hardware.
  -DWAYMESH_RELAY=1
  -DWAYMESH_GPS=1            ; Tier-2 GPS: UART0 time-shared (debug -> NMEA)
  ; v2/auth on-air (doc 13 §3/§5/§6): group filter + keyless relay-policy +
  ; AES-CCM origination + 32-bit reboot-safe packetId. NON-interoperable with a
  ; v1 peer; the XR2 is v2, so this is the production cutover. To rebuild the
  ; legacy v1 PoC, drop -DWAYMESH_V2 (the v0/v1 path is retained in main.cpp).
  -DWAYMESH_V2=1
  ; Provisioning portal (doc 13 §8.4): GPIO0 long-press ~5 s -> SoftAP + web form.
  ; With GPS the serial 'c' fallback only fires while the console owns UART0 (before
  ; NMEA lock / after a no-GPS revert); the GPIO0 trigger always works.
  -DWAYMESH_WIFI_CONFIG=1

; Tier-2 GPS bring-up build. Adds a 1 Hz GPS-state line and keeps CSV logging
; even after the UART0 switch, so GPS wiring/lock can be verified on the bench
; without a sky fix. Flash this for bring-up; bayck_7pwm is the silent production
; build. (Mirrors the waymesh-node esp32c3_xr2_relaytest debug-env pattern.)
; Inherits relay + GPS from bayck_7pwm, then adds the 1 Hz GPS debug line.
[env:bayck_gpstest]
extends = env:bayck_7pwm
build_flags =
  ${env:bayck_7pwm.build_flags}
  -DWAYMESH_GPS_DEBUG=1

; BetaFPV Nano RX (Tier 2/3) — ELRS "Generic 2400 PA" hardware class. Same
; ESP8285 + SX1280 + UART0-time-shared-GPS as the bayck, with ONE hardware
; difference: an external PA/LNA the SX1280 gates via RXEN=GPIO9 / TXEN=GPIO10
; (board_config.h sets these only for this board; RadioLib drives them). Same
; flash procedure as bayck_7pwm (UART pads, GPIO0-low + power-cycle, no auto-
; reset). PRODUCTION build, identical feature set to bayck_7pwm: v2/auth relay +
; GPS originator + WiFi portal (the PA only changes the RF front-end).
[env:betafpv_nano]
extends = env:esp8285_sx1280
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
upload_speed = 460800
build_flags =
  -DWAYMESH_TIER=2
  -DWAYMESH_BOARD_BETAFPV_NANO=1
  -DWAYMESH_RELAY=1
  -DWAYMESH_GPS=1            ; Tier-2 GPS: UART0 time-shared (debug -> NMEA)
  -DWAYMESH_V2=1             ; v2/auth on-air (see bayck_7pwm); production cutover
  -DWAYMESH_WIFI_CONFIG=1    ; provisioning portal (GPIO0 long-press; serial 'c' in console window)

; Nano GPS bring-up build — adds the 1 Hz GPS-state line and keeps CSV logging
; after the UART0 switch so GPS wiring/lock can be verified on the bench without
; a sky fix. betafpv_nano is the silent production build. (Mirrors bayck_gpstest.)
[env:betafpv_nano_gpstest]
extends = env:betafpv_nano
build_flags =
  ${env:betafpv_nano.build_flags}
  -DWAYMESH_GPS_DEBUG=1

; BayckRC full v2/auth build (doc 13 §3/§5/§6/§8.4). The verification env for the
; 8285 port: managed-flood RELAY + the v2/auth on-air codec (-DWAYMESH_V2) +
; the ELRS-style WiFi config portal (-DWAYMESH_WIFI_CONFIG) that provisions the
; home channel / PSK / relay-policy into the same wm_config store the C3 fills over
; BLE (here: EEPROM emulation). With -DWAYMESH_V2 this node ORIGINATES clear/AEAD v2
; beacons on its home chanHash, applies the group filter + keyless relay-policy on
; RX, and AEAD-opens member-group frames — matching the XR2 (already v2). GPS is OFF
; so UART0 stays a stable bench console (the portal trigger needs a readable console
; + serial 'c' fallback); relay stays on so RF-suspend/resume is observable.
;
; This is the GPS-OFF bench twin of the production bayck_7pwm (which now ships the
; same -DWAYMESH_V2 + -DWAYMESH_WIFI_CONFIG): identical on-air/portal behaviour, but
; with GPS off so UART0 stays a stable console + the serial 'c' trigger always works
; (the GPS build gates 'c' to the console window — see checkPortalTrigger). Use this
; for bench verification; flash bayck_7pwm / betafpv_nano in the field.
[env:bayck_portal]
extends = env:esp8285_sx1280
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
upload_speed = 460800
build_flags =
  -DWAYMESH_TIER=2
  -DWAYMESH_BOARD_BAYCK_7PWM=1
  -DWAYMESH_RELAY=1
  -DWAYMESH_WIFI_CONFIG=1    ; SoftAP + captive portal -> wm_config (EEPROM)
  -DWAYMESH_V2=1             ; v2/auth on-air: group filter + AES-CCM + 32-bit pid
