; =============================================================================
; Waymesh Tier 2/3 firmware — ESP8285 + Semtech SX1280 (2.4 GHz LoRa)
;
; PoC #0 (THE GATE for the heterogeneous mesh): prove that the SX1280 on these
; ELRS-class 8285 boards interoperates on-air with the LR1121 on the Tier-1 XR2
; (projects/waymesh-node). Same beacon bytes, same radio params. If it works, the
; 8285 node shows up as a peer in the Meshtastic app via the XR2 BLE gateway.
;
; See ../../docs/hybrid-mesh/09-poc-roadmap.md (Phase H) and 02-hardware-and-rf-
; platform.md (the LR1121<->SX1280 interop crux).
; =============================================================================

; Common ESP8285 + SX1280 base. RadioLib pinned to 7.6.0 to match waymesh-node.
[env:esp8285_sx1280]
platform = espressif8266@4.2.1
board = esp8285
framework = arduino
board_build.f_cpu = 160000000L
monitor_speed = 115200
lib_deps =
  jgromes/RadioLib@7.6.0
  mikalhart/TinyGPSPlus@^1.0.3  ; vendor-neutral NMEA parser; only used under -DWAYMESH_GPS

; BayckRC 7PWM (Tier 2) — ELRS "Generic 2400 PWMP7" hardware class.
; Flash over the UART pads (GPIO1 TX / GPIO3 RX) with esptool at 460800. These
; bare RX boards usually have no DTR/RTS auto-reset, so hold GPIO0 low + power-
; cycle into download mode (same pattern as the XR2's BOOT hold).
[env:bayck_7pwm]
extends = env:esp8285_sx1280
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
upload_speed = 460800
build_flags =
  -DWAYMESH_TIER=2
  -DWAYMESH_BOARD_BAYCK_7PWM=1
  -DWAYMESH_GPS=1            ; Tier-2 GPS: UART0 time-shared (debug -> NMEA)

; Tier-2 GPS bring-up build. Adds a 1 Hz GPS-state line and keeps CSV logging
; even after the UART0 switch, so GPS wiring/lock can be verified on the bench
; without a sky fix. Flash this for bring-up; bayck_7pwm is the silent production
; build. (Mirrors the waymesh-node esp32c3_xr2_relaytest debug-env pattern.)
[env:bayck_gpstest]
extends = env:bayck_7pwm
build_flags =
  ${env:bayck_7pwm.build_flags}
  -DWAYMESH_GPS_DEBUG=1
