; Standalone PlatformIO project for the Waybeam USB TX backpack firmware.
; Extracted from snokvist/Backpack@<base SHA — see README.md> — replaces the
; ESP32C3_TX_Backpack_via_USB env in that repo.

[env:tx-backpack-usb]
platform = espressif32@6.11.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = min_spiffs.csv
board_build.f_cpu = 160000000L
upload_speed = 460800
monitor_speed = 460800
upload_resetmethod = nodemcu

extra_scripts =
	pre:python/build_flags.py
	python/build_env_setup.py
	pre:python/build_html.py

lib_deps =
	ottowinter/ESPAsyncWebServer-esphome @ 3.2.2
	esphome/AsyncTCP-esphome @ 2.1.3
	bblanchon/ArduinoJson @ 7.1.0
	https://github.com/mavlink/c_library_v2.git#e54a8d2e8cf7985e689ad1c8c8f37dc0800ea87b
	adafruit/Adafruit SSD1306@2.5.15
	adafruit/Adafruit GFX Library@1.12.1

build_flags =
	-Wall
	-Iinclude
	-D PLATFORM_ESP32=1
	-D ARDUINO_USB_MODE=1
	-D TARGET_TX_BACKPACK
	-D MAVLINK_ENABLED=1
	-D PIN_BUTTON=9
	-D PIN_LED=8
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D USB_SNIFFER=1
	-D USB_SNIFFER_MIN_GAP_MS=100
	-D USB_SNIFFER_QUIET_AFTER_RX_MS=500
	-D USB_WIRED_CRSF=1
	-D USB_WIRED_CRSF_RX_PIN=20
	-D USB_WIRED_CRSF_TX_PIN=21
	-D USB_WIRED_CRSF_BAUD=420000
	-D USB_WIRED_CRSF_MIN_GAP_MS=5
	-D OLED_DASHBOARD=1
	-D OLED_SDA_PIN=4
	-D OLED_SCL_PIN=5
	-D OLED_I2C_ADDR=0x3C
	-D OLED_REFRESH_MS=200
